services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_PATH: /wenxing
      DB_PATH: /app/data/wenxing.sqlite
      SECURE_COOKIES: "true"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      gateway:
        aliases:
          - wenxing-app
    # Configure your own HTTPS reverse proxy as the public entry point.
    # No host ports and no shared database volumes.
networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-wenxing-gateway}
